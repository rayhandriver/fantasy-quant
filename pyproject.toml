[project]
name = "fantasy-quant"
version = "0.1.0"
description = "Quant-finance-inspired fantasy football draft model and analytics (factor-risk / direct-indexing techniques applied to NFL fantasy)."
authors = [{ name = "Rayhan Driver", email = "rayhan.driver@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
  # --- core scientific stack ---
  "numpy>=1.26",
  "pandas>=2.2",
  "polars>=1.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "scikit-learn>=1.5",
  # --- storage / io ---
  "duckdb>=1.1",
  "pyarrow>=17",
  # --- gradient-boosted models (primary projection models) ---
  "xgboost>=2.1",
  "lightgbm>=4.5",
  # --- scraping / http (free, self-sourced data) ---
  "httpx>=0.27",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  # --- viz ---
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "plotly>=5.24",
  # --- utils ---
  "tqdm>=4.66",
  "python-dotenv>=1.0",
  "pydantic>=2.9",
  # --- notebooks ---
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
]

[project.optional-dependencies]
# NFL data sources. Kept separate because nfl_data_py historically pins pandas tightly
# and can fight the core resolve. Install + test on its own:  uv sync --extra data
data = [
  "nfl_data_py>=0.3.2",
]
# Bayesian / hierarchical models for thin-sample priors (Phase 2). Heavy (pytensor).
# Install when needed:  uv sync --extra bayes
bayes = [
  "pymc>=5.16",
  "arviz>=0.19",
]
# The draft app (Phase 14.1 / Session K1). Streamlit-first per PERSONALIZATION §8.
# Install + run:  uv sync --extra ui  &&  uv run streamlit run app/main.py
ui = [
  "streamlit>=1.38",
]
reports = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_quant"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "steps", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the top-level `app` package on the path: the app is a renderer over the
# engine, deliberately outside the installed library, and its tests import it.
pythonpath = ["src", "."]
